services:
  monitor:
    build: .
    container_name: jp-second-hand-monitor
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - TZ=Asia/Tokyo
      # 直接引用宿主机 .env（配置代理/渠道密钥）
    env_file:
      - .env
    volumes:
      # SQLite 数据持久化到宿主机 ./data
      - ./data:/app/data
