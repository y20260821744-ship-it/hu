<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · 日本二手平台上新监控</title>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#111827; font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    .card { width:360px; max-width:92vw; background:#fff; border-radius:12px; padding:28px 26px; box-shadow:0 10px 30px rgba(0,0,0,.25); }
    h1 { font-size:18px; margin:0 0 4px; color:#1f2937; }
    .sub { color:#6b7280; font-size:13px; margin-bottom:20px; }
    label { display:block; font-size:13px; color:#374151; margin:12px 0 4px; }
    input { width:100%; padding:9px 11px; border:1px solid #d1d5db; border-radius:6px; font-size:14px; }
    input:focus { outline:none; border-color:#2563eb; }
    button { width:100%; margin-top:20px; padding:10px; border:none; border-radius:6px; background:#2563eb; color:#fff; font-size:14px; cursor:pointer; }
    button:hover { background:#1d4ed8; }
    .msg { background:#fee2e2; color:#b91c1c; border-radius:6px; padding:9px 12px; font-size:13px; margin-bottom:8px; }
    .hint { margin-top:16px; color:#9ca3af; font-size:12px; text-align:center; }
  </style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <h1>🛰 上新监控系统</h1>
    <div class="sub">日本二手平台上新监控 · 请登录后使用</div>
    {% if msg %}<div class="msg">{{ msg }}</div>{% endif %}
    <input type="hidden" name="next" value="{{ request.query_params.get('next', '/') }}">
    <label for="username">用户名</label>
    <input id="username" name="username" type="text" autocomplete="username" required autofocus>
    <label for="password">密码</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">登 录</button>
    <div class="hint">首次使用默认账号 admin / admin123，登录后请到「账号管理」修改密码</div>
  </form>
</body>
</html>
